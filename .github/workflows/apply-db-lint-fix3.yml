name: Apply database lint fix 3

on:
  push:
    branches:
      - agent/database-playground
    paths:
      - .github/workflows/apply-db-lint-fix3.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/database-playground

      - name: Patch lint failures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('app/playgrounds/databases/database-playground.tsx')
          lines = ui.read_text().splitlines()

          start = next(i for i, line in enumerate(lines)
                       if line == '  useEffect(() => {'
                       and i + 1 < len(lines)
                       and 'const existing = localStorage.getItem(SESSION_KEY);' in lines[i + 1])
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == '  }, []);')
          lines[start:end + 1] = [
              '  useEffect(() => {',
              '    const timer = window.setTimeout(() => {',
              '      const existing = localStorage.getItem(SESSION_KEY);',
              '      const nextSession = existing && /^[A-Za-z0-9_-]{8,200}$/.test(existing) ? existing : newSessionId();',
              '      localStorage.setItem(SESSION_KEY, nextSession);',
              '      setSessionId(nextSession);',
              '      const savedEngine = localStorage.getItem(ENGINE_KEY);',
              '      const nextEngine: Engine = savedEngine === "postgres" ? "postgres" : "mysql";',
              '      setEngine(nextEngine);',
              '      setSql(localStorage.getItem(`${SQL_KEY}:${nextEngine}`) || STARTER_SQL[nextEngine]);',
              '      setHistory(readHistory());',
              '    }, 0);',
              '    return () => window.clearTimeout(timer);',
              '  }, []);',
          ]

          start = next(i for i, line in enumerate(lines)
                       if line == '  useEffect(() => {'
                       and i + 1 < len(lines)
                       and 'if (sessionId) void refreshSchema();' in lines[i + 1])
          end = next(i for i in range(start + 1, len(lines)) if lines[i] == '  }, [refreshSchema, sessionId]);')
          lines[start:end + 1] = [
              '  useEffect(() => {',
              '    if (!sessionId) return;',
              '    const timer = window.setTimeout(() => void refreshSchema(), 0);',
              '    return () => window.clearTimeout(timer);',
              '  }, [refreshSchema, sessionId]);',
          ]
          ui.write_text('\n'.join(lines) + '\n')

          sidecar = Path('ops/hetzner/db-lab-api/server.mjs')
          text = sidecar.read_text()
          old = 'function readLike(kind) {\n  return ["SELECT", "SHOW", "DESCRIBE", "DESC", "EXPLAIN"].includes(kind);\n}\n\n'
          sidecar.write_text(text.replace(old, '', 1))
          PY

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "gimmejob-agent"
          git config user.email "77669556+sergiiiavt@users.noreply.github.com"
          git add app/playgrounds/databases/database-playground.tsx ops/hetzner/db-lab-api/server.mjs
          git commit -m "Fix database playground lint failures"
          git push origin HEAD:agent/database-playground
