name: Deploy production

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build production artifact
        run: npm run build

      - name: Deploy Worker and D1
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL_AI_DAILY_GLOBAL_LIMIT: ${{ vars.EMAIL_AI_DAILY_GLOBAL_LIMIT }}
          EMAIL_AI_DAILY_USER_LIMIT: ${{ vars.EMAIL_AI_DAILY_USER_LIMIT }}
          EMAIL_AI_ENABLED: ${{ vars.EMAIL_AI_ENABLED }}
          GIMMEJOB_AI_SERVICE_TOKEN: ${{ secrets.GIMMEJOB_AI_SERVICE_TOKEN }}
          GIMMEJOB_AI_URL: ${{ vars.GIMMEJOB_AI_URL }}
          GIMMEJOB_RAG_SERVICE_TOKEN: ${{ secrets.GIMMEJOB_RAG_SERVICE_TOKEN }}
          GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
          MCP_SERVICE_TOKEN: ${{ secrets.MCP_SERVICE_TOKEN }}
          MULTI_USER_ENABLED: ${{ vars.MULTI_USER_ENABLED }}
          N8N_INGEST_TOKEN: ${{ secrets.N8N_INGEST_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: node scripts/deploy-cloudflare.mjs

      - name: Verify production
        shell: bash
        run: |
          retry() {
            for attempt in {1..10}; do
              if "$@"; then
                return 0
              fi
              echo "Waiting for production (attempt $attempt/10)..."
              sleep 3
            done
            return 1
          }

          check_page() {
            curl --fail --silent --show-error --location --max-time 20 \
              --output /dev/null "$1"
          }

          check_logo() {
            local file="/tmp/gimmejob-logo.png"
            curl --fail --silent --show-error --location --max-time 20 \
              --output "$file" "$1" || return 1
            LOGO_FILE="$file" node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import sharp from "sharp";

          const expected = "f4d7cc3beac0fdf960b2f3e23a2afcb7f4ec75202a475bac5a7b71efd003cfef";
          const { data, info } = await sharp(process.env.LOGO_FILE).ensureAlpha().raw().toBuffer({ resolveWithObject: true });
          const actual = createHash("sha256").update(data).digest("hex");
          if (info.width !== 188 || info.height !== 54 || info.channels !== 4 || actual !== expected) {
            console.error(`Production logo mismatch: ${info.width}x${info.height}/${actual}`);
            process.exit(1);
          }
          NODE
          }

          check_health() {
            local body
            body="$(curl --fail --silent --show-error --location --max-time 20 "$1")" &&
              grep -Fq '"ok":true' <<<"$body"
          }

          check_logout() {
            local headers="/tmp/gimmejob-logout-headers"
            local status
            status="$(curl --silent --show-error --max-time 20 \
              --request POST \
              --header 'Cookie: gimmejob_user_session=production-logout-probe' \
              --header 'Referer: https://gimme-job.com/' \
              --dump-header "$headers" \
              --output /dev/null \
              --write-out '%{http_code}' \
              'https://gimme-job.com/logout')" || return 1
            [[ "$status" == "303" ]] || return 1
            grep -Eiq '^set-cookie: gimmejob_user_session=;.*Max-Age=0' "$headers"
          }

          retry check_page "https://gimme-job.com/"
          retry check_logo "https://gimme-job.com/gimmejob-logo.png"
          retry check_health "https://gimme-job.com/api/health"
          retry check_logout
