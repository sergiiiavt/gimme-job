name: T1 browser verification

on:
  push:
    branches:
      - agent/scheduled-vacancy-ingestion

jobs:
  browser-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Use Node.js 22.22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local agent and web app
        shell: bash
        run: |
          npm run api > /tmp/gimme-agent.log 2>&1 &
          echo $! > /tmp/gimme-agent.pid
          npm run local:web > /tmp/gimme-web.log 2>&1 &
          echo $! > /tmp/gimme-web.pid

          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4317/api/health >/dev/null && curl --fail --silent http://127.0.0.1:4173/vacancies >/dev/null; then
              break
            fi
            sleep 1
          done

          curl --fail --silent http://127.0.0.1:4317/api/health
          curl --fail --silent http://127.0.0.1:4173/vacancies >/dev/null

      - name: Record a real local sync marker
        shell: bash
        run: |
          curl --fail --silent             -H 'content-type: application/json'             -d '{"manualOnly":true}'             http://127.0.0.1:4317/api/sync > /tmp/sync-response.json
          cat /tmp/sync-response.json
          curl --fail --silent http://127.0.0.1:4317/api/vacancy-sync | tee /tmp/vacancy-sync.json

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Capture desktop and mobile renders
        shell: bash
        run: |
          mkdir -p browser-verification
          python - <<'PY'
          from pathlib import Path
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait

          url = "http://127.0.0.1:4173/vacancies"
          cases = [("desktop", 1440, 900), ("mobile-375", 375, 812)]

          for name, width, height in cases:
              options = Options()
              options.add_argument("--headless=new")
              options.add_argument("--no-sandbox")
              options.add_argument("--disable-dev-shm-usage")
              options.add_argument("--disable-gpu")
              options.add_argument(f"--window-size={width},{height}")
              driver = webdriver.Chrome(options=options)
              try:
                  driver.set_window_size(width, height)
                  driver.get(url)
                  wait = WebDriverWait(driver, 20)
                  freshness = wait.until(
                      lambda d: next(
                          (
                              el for el in d.find_elements(By.CSS_SELECTOR, ".vacancy-catalog-freshness")
                              if "Vacancies collected" in el.text
                          ),
                          False,
                      )
                  )
                  stat_line = driver.find_element(By.CSS_SELECTOR, ".vacancy-catalog-summary .stat-line")
                  fresh_rect = driver.execute_script("return arguments[0].getBoundingClientRect()", freshness)
                  stat_rect = driver.execute_script("return arguments[0].getBoundingClientRect()", stat_line)
                  viewport = driver.execute_script(
                      "return {clientWidth: document.documentElement.clientWidth, scrollWidth: document.documentElement.scrollWidth}"
                  )

                  assert fresh_rect["top"] >= stat_rect["bottom"], (
                      f"{name}: freshness must render underneath stats: fresh={fresh_rect}, stats={stat_rect}"
                  )
                  assert viewport["scrollWidth"] <= viewport["clientWidth"], (
                      f"{name}: horizontal overflow detected: {viewport}"
                  )

                  Path(f"browser-verification/{name}.txt").write_text(
                      f"freshness={freshness.text}\n"
                      f"stats_bottom={stat_rect['bottom']}\n"
                      f"freshness_top={fresh_rect['top']}\n"
                      f"client_width={viewport['clientWidth']}\n"
                      f"scroll_width={viewport['scrollWidth']}\n"
                  )
                  driver.save_screenshot(f"browser-verification/{name}.png")
              finally:
                  driver.quit()
          PY

      - name: Upload browser verification
        uses: actions/upload-artifact@v4
        with:
          name: t1-browser-verification
          path: browser-verification
          if-no-files-found: error

      - name: Show server logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- agent ---'
          cat /tmp/gimme-agent.log || true
          echo '--- web ---'
          cat /tmp/gimme-web.log || true
