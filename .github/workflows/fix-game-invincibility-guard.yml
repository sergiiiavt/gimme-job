name: Fix game invincibility guard

on:
  push:
    branches: ["feature/game-phase-balance-invincibility"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-phase-balance-invincibility
      - name: Fix input guard
        run: python scripts/fix_game_invincibility_guard.py
      - name: Remove temporary files
        run: rm .github/workflows/fix-game-invincibility-guard.yml scripts/fix_game_invincibility_guard.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep controls active during respawn invincibility"
          git push origin HEAD:feature/game-phase-balance-invincibility
