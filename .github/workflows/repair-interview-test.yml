name: Repair interview catalog test

on:
  push:
    branches: [remove-rewild-game]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remove-rewild-game
      - name: Repair Promise setup
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/interview-catalog.test.mjs')
          text = path.read_text(encoding='utf-8')
          marker = 'test("lazy-loads the catalog, unifies filters, and caps each rendered page at 60", async () => {\n'
          declaration = '  const [uiSource, stylesSource, navigationSource, routeSource, schemaSource, resumeSource, aboutSource, aboutContentSource, privateJobsSource] = await Promise.all([\n'
          if declaration not in text:
              text = text.replace(marker, marker + declaration, 1)
          text = ''.join(line for line in text.splitlines(keepends=True) if 'app/rewild-game.tsx' not in line)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/interview-catalog.test.mjs
          git commit -m "Repair interview catalog test setup"
          git push origin HEAD:remove-rewild-game
