name: Debug Locust learning path

on:
  push:
    branches: [docs/locust-learning-path]

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Lint
        continue-on-error: true
        run: npm run lint
      - name: Agent typecheck
        continue-on-error: true
        run: npm run check:agent
      - name: Testing tools validator
        continue-on-error: true
        run: node scripts/validate-testing-tools-content.mjs
      - name: All content validators
        continue-on-error: true
        run: npm run check:content
      - name: Rewild assets
        continue-on-error: true
        run: npm run check:rewild-assets
      - name: Database generation check
        continue-on-error: true
        run: npm run check:db
      - name: Build
        continue-on-error: true
        run: npm run build
      - name: Coverage
        continue-on-error: true
        run: npm run test:coverage
      - name: Cloudflare dry run
        continue-on-error: true
        run: npm run check:cloudflare
