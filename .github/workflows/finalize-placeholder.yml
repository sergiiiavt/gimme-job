name: Finalize placeholder cleanup

on:
  push:
    branches: [remove-rewild-game]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out cleanup branch
        uses: actions/checkout@v6
        with:
          ref: remove-rewild-game
          fetch-depth: 0

      - name: Apply cleanup transformation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/remove-rewild.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY' 2>&1 | tee cleanup-debug.log\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          script = textwrap.dedent(source[start:end])
          Path('/tmp/apply_cleanup.py').write_text(script, encoding='utf-8')
          Path('.github/workflows/finalize-placeholder.yml').unlink()
          subprocess.run(['python', '/tmp/apply_cleanup.py'], check=True)
          PY

      - name: Remove final selector assertions and temporary workflows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          catalog_path = Path('tests/interview-catalog.test.mjs')
          catalog = catalog_path.read_text(encoding='utf-8')
          catalog = ''.join(line for line in catalog.splitlines(keepends=True) if 'rw-' not in line)
          catalog_path.write_text(catalog, encoding='utf-8')

          Path('.github/workflows/remove-rewild.yml').unlink(missing_ok=True)

          banned = re.compile(r'rewild|fight[ -]ai[ -]slop|fight-ai-slop|anti-slop|rw-', re.I)
          leftovers = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if banned.search(str(path)) or banned.search(text):
                  leftovers.append(str(path))
          if leftovers:
              raise SystemExit('Legacy feature references remain:\n' + '\n'.join(sorted(set(leftovers))))
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        shell: bash
        run: |
          set +e
          npm run verify 2>&1 | tee verify-debug.log
          status=${PIPESTATUS[0]}
          exit "$status"

      - name: Upload verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: final-verification
          path: verify-debug.log
          if-no-files-found: error
          retention-days: 1

      - name: Inspect diff
        run: |
          rm -f verify-debug.log
          git diff --check
          git status --short
          git diff --stat

      - name: Commit verified cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows/finalize-placeholder.yml .github/workflows/remove-rewild.yml
          git add -A
          git commit -m "Remove retired game and keep neutral placeholder"
          git push origin HEAD:remove-rewild-game
