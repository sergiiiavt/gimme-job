name: Publish AI service image

on:
  pull_request:
    paths:
      - ai-service/**
      - content/**
      - .github/workflows/ai-image.yml
      - ops/hetzner/**
  push:
    branches:
      - main
    paths:
      - ai-service/**
      - content/**
      - .github/workflows/ai-image.yml
      - ops/hetzner/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/gimme-job-ai

jobs:
  build:
    name: build-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ai-service/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy-to-hetzner
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      DEPLOY_HOST: n8n.gimme-job.com
      DEPLOY_USER: root
      AI_URL: https://ai.gimme-job.com
      HETZNER_DEPLOY_SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}
      GIMMEJOB_AI_OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GIMMEJOB_AI_OPENAI_MODEL: ${{ vars.GIMMEJOB_AI_OPENAI_MODEL || 'gpt-5.4-mini' }}
      GIMMEJOB_AI_SERVICE_TOKEN: ${{ secrets.GIMMEJOB_AI_SERVICE_TOKEN }}
      GIMMEJOB_AI_RAG_SERVICE_TOKEN: ${{ secrets.GIMMEJOB_RAG_SERVICE_TOKEN }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_BASE_URL: ${{ vars.LANGFUSE_BASE_URL || 'https://cloud.langfuse.com' }}

    steps:
      - name: Check out production source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            HETZNER_DEPLOY_SSH_KEY
            GIMMEJOB_AI_OPENAI_API_KEY
            GIMMEJOB_AI_SERVICE_TOKEN
            GIMMEJOB_AI_RAG_SERVICE_TOKEN
            LANGFUSE_PUBLIC_KEY
            LANGFUSE_SECRET_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required repository secret $name is missing." >&2
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_DEPLOY_SSH_KEY" >"$HOME/.ssh/gimmejob-deploy"
          chmod 600 "$HOME/.ssh/gimmejob-deploy"
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Build protected AI runtime environment
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          cat >"$RUNNER_TEMP/gimmejob-ai.env" <<EOF
          GIMMEJOB_AI_ENVIRONMENT=production
          GIMMEJOB_AI_OPENAI_API_KEY=$GIMMEJOB_AI_OPENAI_API_KEY
          GIMMEJOB_AI_OPENAI_MODEL=$GIMMEJOB_AI_OPENAI_MODEL
          GIMMEJOB_AI_SERVICE_TOKEN=$GIMMEJOB_AI_SERVICE_TOKEN
          GIMMEJOB_AI_CONTENT_ROOT=/app/content
          GIMMEJOB_AI_REQUEST_TIMEOUT_SECONDS=45
          GIMMEJOB_AI_RAG_URL=https://gimme-job.com/internal/rag/search
          GIMMEJOB_AI_RAG_SERVICE_TOKEN=$GIMMEJOB_AI_RAG_SERVICE_TOKEN
          LANGFUSE_PUBLIC_KEY=$LANGFUSE_PUBLIC_KEY
          LANGFUSE_SECRET_KEY=$LANGFUSE_SECRET_KEY
          LANGFUSE_BASE_URL=$LANGFUSE_BASE_URL
          LANGFUSE_TRACING_ENVIRONMENT=production
          EOF
          chmod 600 "$RUNNER_TEMP/gimmejob-ai.env"

      - name: Upload runtime configuration
        shell: bash
        run: |
          set -euo pipefail
          SSH=(ssh -i "$HOME/.ssh/gimmejob-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          SCP=(scp -i "$HOME/.ssh/gimmejob-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)

          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'install -d -m 700 /opt/gimmejob-n8n'

          "${SCP[@]}" \
            ops/hetzner/docker-compose.yml \
            ops/hetzner/Caddyfile \
            "$RUNNER_TEMP/gimmejob-ai.env" \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/gimmejob-n8n/"

          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/gimmejob-n8n
          mv -f gimmejob-ai.env ai.env
          chmod 600 ai.env
          chmod 644 docker-compose.yml Caddyfile
          docker compose --profile ai pull gimmejob-ai caddy
          docker compose --profile ai up -d gimmejob-ai caddy
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          docker compose --profile ai ps
          REMOTE

      - name: Verify AI HTTPS and readiness
        shell: bash
        run: |
          set -euo pipefail
          last_body=""
          for attempt in $(seq 1 60); do
            body="$(curl --fail --silent --show-error --max-time 10 "$AI_URL/health" || true)"
            last_body="$body"
            if grep -Fq '"status":"ok"' <<<"$body"; then
              echo "AI service is ready at $AI_URL"
              exit 0
            fi
            echo "Waiting for AI container, DNS, TLS, canonical RAG and model readiness ($attempt/60)..."
            sleep 5
          done
          echo "AI service did not become ready within 5 minutes." >&2
          if [[ -n "$last_body" ]]; then
            echo "Last health response: $last_body" >&2
          fi
          exit 1

      - name: Verify Learning Advisor end to end
        shell: bash
        run: |
          set -euo pipefail
          payload='{"messages":[{"role":"user","content":"Python parallelism"}],"session_id":"production-deploy-smoke"}'
          body="$(curl --fail --silent --show-error --max-time 60 \
            --request POST \
            --header "Authorization: Bearer $GIMMEJOB_AI_SERVICE_TOKEN" \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$AI_URL/v1/learning-path")"

          if ! grep -Fq '"orchestration":"langgraph"' <<<"$body"; then
            echo "Learning Advisor smoke response did not match the LangGraph contract." >&2
            exit 1
          fi
          if ! grep -Fq '"learning_map"' <<<"$body"; then
            echo "Learning Advisor smoke response did not include a learning map." >&2
            exit 1
          fi
          if grep -Fq '"id":"runtime_fallback"' <<<"$body"; then
            echo "Learning Advisor reached its safe runtime fallback; the primary AI workflow is still failing." >&2
            exit 1
          fi
          echo "Learning Advisor primary workflow passed end-to-end smoke verification."

      - name: Collect AI service diagnostics
        if: failure()
        shell: bash
        run: |
          SSH=(ssh -i "$HOME/.ssh/gimmejob-deploy" -o BatchMode=yes -o StrictHostKeyChecking=yes)
          "${SSH[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/gimmejob-n8n && docker compose --profile ai logs --no-color --tail=160 gimmejob-ai' || true
