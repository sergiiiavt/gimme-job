name: WebSocket handshake diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe public WebSocket upgrade
        shell: bash
        run: |
          set +e
          curl --http1.1 --include --silent --show-error --max-time 5 \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Sec-WebSocket-Version: 13' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            'https://ai.gimme-job.com/v1/playground/ws?room=playground' \
            > websocket-handshake.txt 2>&1
          result=$?
          set -e
          cat websocket-handshake.txt
          echo "curl_exit=$result"
