name: Patch retired game CI gate

on:
  push:
    branches: [remove-retired-game-ci-gate]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: remove-retired-game-ci-gate
      - name: Remove obsolete visual gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'\n      - name: Verify Rewild visual benchmark\n        run: npm run check:rewild-visual\n\n      - name: Upload Rewild visual regression\n        if: failure\(\)\n        uses: actions/upload-artifact@v4\n        with:\n          name: rewild-visual-regression\n          path: artifacts/rewild-benchmark-actual\.png\n          if-no-files-found: ignore\n          retention-days: 3\n',
              '\n',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Obsolete visual gate block not found exactly once')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "Remove retired game visual CI gate"
          git push origin HEAD:remove-retired-game-ci-gate
