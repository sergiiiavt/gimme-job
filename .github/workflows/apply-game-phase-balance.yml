name: Apply game phase balance patch

on:
  push:
    branches: ["feature/game-phase-balance-invincibility"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/game-phase-balance-invincibility
      - name: Relax strict patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("scripts/patch_game_phase_balance.py")
          text = path.read_text()
          text = text.replace("if source.count('if (deadUntil !== 0 || won) return;') != 2:\n    raise SystemExit(\"Expected exactly two die guards\")\n", "")
          path.write_text(text)
          PY
      - name: Apply patch
        run: python scripts/patch_game_phase_balance.py
      - name: Remove temporary patch files
        run: rm .github/workflows/apply-game-phase-balance.yml scripts/patch_game_phase_balance.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Balance phase shooters and add respawn invincibility"
          git push origin HEAD:feature/game-phase-balance-invincibility
