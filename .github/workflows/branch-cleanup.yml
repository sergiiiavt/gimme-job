name: Branch Cleanup

on:
  workflow_run:
    workflows:
      - Code quality
    types:
      - completed
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  initial-cleanup:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - name: Delete accumulated branches once
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CLEANUP_SENTINEL: chore/cleanup-old-branches
        run: |
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          sentinel = os.environ["CLEANUP_SENTINEL"]
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "gimme-job-branch-cleanup",
          }

          sentinel_ref = urllib.parse.quote(f"heads/{sentinel}", safe="/")
          sentinel_request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/ref/{sentinel_ref}",
              headers=headers,
          )
          try:
              with urllib.request.urlopen(sentinel_request):
                  pass
          except urllib.error.HTTPError as error:
              if error.code == 404:
                  print("Initial branch cleanup already completed.")
                  raise SystemExit(0)
              raise

          branches = []
          page = 1
          while True:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/branches?per_page=100&page={page}",
                  headers=headers,
              )
              with urllib.request.urlopen(request) as response:
                  batch = json.load(response)
              if not batch:
                  break
              branches.extend(branch["name"] for branch in batch)
              if len(batch) < 100:
                  break
              page += 1

          failures = []
          deleted = 0
          for branch in branches:
              if branch == default_branch:
                  continue
              ref = urllib.parse.quote(f"heads/{branch}", safe="/")
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repository}/git/refs/{ref}",
                  headers=headers,
                  method="DELETE",
              )
              try:
                  with urllib.request.urlopen(request):
                      pass
                  deleted += 1
                  print(f"Deleted: {branch}")
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      print(f"Already deleted: {branch}")
                      continue
                  failures.append((branch, error.code))
                  print(f"Failed: {branch} ({error.code})")

          print(f"Deleted {deleted} branch(es); kept {default_branch}.")
          if failures:
              raise SystemExit(f"Failed to delete: {failures}")

  delete-merged-branch:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branch
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["HEAD_REF"]
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/refs/{ref}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "gimme-job-branch-cleanup",
              },
              method="DELETE",
          )
          try:
              with urllib.request.urlopen(request):
                  pass
              print(f"Deleted merged branch: {branch}")
          except urllib.error.HTTPError as error:
              if error.code in (404, 422):
                  print(f"Branch already deleted or protected: {branch}")
              else:
                  raise
