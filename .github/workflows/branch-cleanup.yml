name: Branch Cleanup

on:
  pull_request:
    types:
      - closed

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete merged PR branch
        shell: python
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repository = os.environ["REPOSITORY"]
          branch = os.environ["HEAD_REF"]
          ref = urllib.parse.quote(f"heads/{branch}", safe="/")
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/git/refs/{ref}",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "gimme-job-branch-cleanup",
              },
              method="DELETE",
          )
          try:
              with urllib.request.urlopen(request):
                  pass
              print(f"Deleted merged branch: {branch}")
          except urllib.error.HTTPError as error:
              if error.code in (404, 422):
                  print(f"Branch already deleted or protected: {branch}")
              else:
                  raise
