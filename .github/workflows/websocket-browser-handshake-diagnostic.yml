name: WebSocket browser handshake diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Probe Chrome-style WebSocket upgrade
        shell: bash
        run: |
          set +e
          curl --http1.1 --include --silent --show-error --max-time 5 \
            --header 'Connection: Upgrade' \
            --header 'Upgrade: websocket' \
            --header 'Origin: https://gimme-job.com' \
            --header 'Sec-WebSocket-Version: 13' \
            --header 'Sec-WebSocket-Key: dGhlIHNhbXBsZSBub25jZQ==' \
            --header 'Sec-WebSocket-Extensions: permessage-deflate; client_max_window_bits' \
            --header 'User-Agent: Mozilla/5.0 Chrome/151.0.0.0 Safari/537.36' \
            'https://gimme-job.com/playgrounds/websocket/ws?room=browser-probe' \
            > websocket-browser-handshake.txt 2>&1
          result=$?
          set -e
          cat websocket-browser-handshake.txt
          echo "curl_exit=$result"

  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright Chromium
        shell: bash
        run: |
          mkdir -p /tmp/ws-browser
          cd /tmp/ws-browser
          npm init -y >/dev/null
          npm install --silent @playwright/test@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live WebSocket in Chromium
        shell: bash
        run: |
          cd /tmp/ws-browser
          cat > websocket.spec.js <<'JS'
          const { test, expect } = require('@playwright/test');

          test('live WebSocket playground connects from Chromium', async ({ page }) => {
            page.on('console', (message) => console.log(`browser console [${message.type()}] ${message.text()}`));
            page.on('pageerror', (error) => console.log(`browser pageerror ${error.message}`));

            await page.goto('https://gimme-job.com/playgrounds/websocket', { waitUntil: 'domcontentloaded' });
            await expect(page.getByRole('heading', { name: 'WebSocket Playground' })).toBeVisible({ timeout: 10000 });

            const directResult = await page.evaluate(() => new Promise((resolve) => {
              const socket = new WebSocket(`wss://gimme-job.com/playgrounds/websocket/ws?room=chromium-${Date.now()}`);
              const timer = setTimeout(() => resolve({ ok: false, reason: 'timeout' }), 10000);
              socket.onopen = () => socket.send(JSON.stringify({ action: 'echo', message: 'chromium-smoke' }));
              socket.onerror = () => {
                clearTimeout(timer);
                resolve({ ok: false, reason: 'error' });
              };
              socket.onclose = (event) => {
                if (event.code !== 1000) {
                  clearTimeout(timer);
                  resolve({ ok: false, reason: `close:${event.code}:${event.reason}` });
                }
              };
              socket.onmessage = (event) => {
                try {
                  const payload = JSON.parse(String(event.data));
                  if (payload.type === 'echo' && payload.data === 'chromium-smoke') {
                    clearTimeout(timer);
                    socket.close(1000, 'Chromium smoke passed');
                    resolve({ ok: true });
                  }
                } catch {}
              };
            }));
            console.log(`directResult=${JSON.stringify(directResult)}`);
            expect(directResult).toEqual({ ok: true });

            await page.getByRole('button', { name: 'Connect' }).click();
            await expect(page.getByText('OPEN', { exact: true })).toBeVisible({ timeout: 10000 });
            await expect(page.getByText(/"type":"connected"/)).toBeVisible({ timeout: 10000 });
          });
          JS
          npx playwright test websocket.spec.js --reporter=line
