name: Apply starred filter layout adjustment

on:
  push:
    branches:
      - agent/starred-filter-first-compact

permissions:
  contents: write

concurrency:
  group: starred-filter-layout
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/starred-filter-first-compact
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Move and narrow personal star filter
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui_path = Path("app/public-site.tsx")
          ui = ui_path.read_text()
          grid_before = '''        <div className="iq-filter-grid">\n          <InterviewFilter emptyLabel="Most common first"'''
          grid_after = '''        <div className={`iq-filter-grid${mode === "personal" ? " iq-filter-grid-personal" : ""}`}>\n          <InterviewFilter emptyLabel="Most common first"'''
          assert ui.count(grid_before) == 1, "Expected one interview filter grid target"
          ui = ui.replace(grid_before, grid_after, 1)

          star_block = '''          {mode === "personal" && (\n            <button\n              aria-pressed={starredOnly}\n              className={`iq-star-filter${starredOnly ? " active" : ""}`}\n              onClick={() => { setStarredOnly((current) => !current); setPage(0); }}\n              type="button"\n            >\n              <span className="iq-star-filter-icon" aria-hidden="true">★</span>\n              <span className="iq-star-filter-copy"><small>Personal</small><strong>Starred only</strong></span>\n            </button>\n          )}\n'''
          assert ui.count(star_block) == 1, "Expected one personal star filter block"
          ui = ui.replace(star_block, "", 1)
          grid_marker = '''        <div className={`iq-filter-grid${mode === "personal" ? " iq-filter-grid-personal" : ""}`}>\n'''
          assert ui.count(grid_marker) == 1, "Expected one personal interview grid marker"
          ui = ui.replace(grid_marker, grid_marker + star_block, 1)
          ui_path.write_text(ui)

          css_path = Path("app/globals.css")
          css = css_path.read_text()
          css_before = '.iq-filter-grid { border-top: 1px solid #edf0ec; display: grid; gap: 8px; grid-template-columns: repeat(4, minmax(0, 1fr)) auto; padding-top: 13px; }\n'
          css_after = css_before + '.iq-filter-grid-personal { grid-template-columns: 160px repeat(3, minmax(0, 1fr)) auto; }\n'
          assert css.count(css_before) == 1, "Expected one desktop filter-grid rule"
          css = css.replace(css_before, css_after, 1)
          css_path.write_text(css)

          test_path = Path("tests/interview-catalog.test.mjs")
          tests = test_path.read_text()
          test_marker = '  assert.match(stylesSource, /\\.iq-star-filter \\{/);\n'
          test_addition = (
              test_marker
              + '  assert.match(stylesSource, /\\.iq-filter-grid-personal \\{[^}]*grid-template-columns: 160px/);\n'
              + '  assert.ok(uiSource.indexOf("iq-star-filter${starredOnly") < uiSource.indexOf("emptyLabel=\\\"Most common first\\\""));\n'
          )
          assert tests.count(test_marker) == 1, "Expected one star-filter style assertion"
          tests = tests.replace(test_marker, test_addition, 1)
          test_path.write_text(tests)
          PY

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        run: npm run verify

      - name: Commit final product diff
        shell: bash
        run: |
          rm -f .github/workflows/tmp-star-filter-layout.yml .tmp-star-filter-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/public-site.tsx app/globals.css tests/interview-catalog.test.mjs .github/workflows/tmp-star-filter-layout.yml .tmp-star-filter-trigger
          git commit -m "Move starred filter first and narrow it"
          git push origin HEAD:agent/starred-filter-first-compact
