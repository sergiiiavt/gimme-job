name: Code quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        run: npm run verify

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install AI service test dependencies
        run: python -m pip install -e "./ai-service[test]"

      - name: Verify AI service with coverage
        working-directory: ai-service
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=80
          python -m coverage xml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: SonarQube Cloud quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.tests=tests,ai-service/tests
            -Dsonar.test.inclusions=tests/**,ai-service/tests/**
            -Dsonar.python.coverage.reportPaths=ai-service/coverage.xml
            -Dsonar.python.version=3.12,3.13,3.14
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-main:
    name: Refresh Sonar main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for coverage-backed analysis
        run: npm run build

      - name: Collect coverage
        run: npm run test:coverage

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install AI service test dependencies
        run: python -m pip install -e "./ai-service[test]"

      - name: Collect AI service coverage
        working-directory: ai-service
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --fail-under=80
          python -m coverage xml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Refresh SonarQube Cloud main branch
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.tests=tests,ai-service/tests
            -Dsonar.test.inclusions=tests/**,ai-service/tests/**
            -Dsonar.python.coverage.reportPaths=ai-service/coverage.xml
            -Dsonar.python.version=3.12,3.13,3.14
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
