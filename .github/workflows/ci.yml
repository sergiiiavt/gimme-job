name: CI and Cloudflare deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        run: npm run verify

      - name: SonarQube Cloud scan
        id: sonar
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Diagnose Sonar PR issues
        if: steps.sonar.outcome == 'failure'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: bash
        run: |
          echo "--- Sonar unresolved PR issues ---"
          curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/issues/search?componentKeys=sergiiiavt_gimme-job&pullRequest=104&resolved=false&ps=100" \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>{
                const p=JSON.parse(s);
                for (const i of p.issues ?? []) console.log(JSON.stringify({rule:i.rule,severity:i.severity,type:i.type,message:i.message,component:i.component,line:i.line,impacts:i.impacts}));
              });'
          echo "--- Sonar PR measures ---"
          curl --fail --silent --show-error --user "$SONAR_TOKEN:" \
            "https://sonarcloud.io/api/measures/component?component=sergiiiavt_gimme-job&pullRequest=104&metricKeys=new_coverage,new_reliability_rating,new_bugs" \
            | node -e '
              let s=""; process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.stringify(JSON.parse(s), null, 2)));'
          exit 1

      - name: Deploy Worker and D1
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && steps.sonar.outcome == 'success'
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          EMAIL_AI_DAILY_GLOBAL_LIMIT: ${{ vars.EMAIL_AI_DAILY_GLOBAL_LIMIT }}
          EMAIL_AI_DAILY_USER_LIMIT: ${{ vars.EMAIL_AI_DAILY_USER_LIMIT }}
          EMAIL_AI_ENABLED: ${{ vars.EMAIL_AI_ENABLED }}
          GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
          MULTI_USER_ENABLED: ${{ vars.MULTI_USER_ENABLED }}
          N8N_INGEST_TOKEN: ${{ secrets.N8N_INGEST_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        shell: bash
        run: |
          if [[ -z "$APP_PASSWORD" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" || -z "$GRAFANA_READ_TOKEN" || -z "$N8N_INGEST_TOKEN" ]]; then
            echo "::notice::Cloudflare deployment skipped until APP_PASSWORD, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, GRAFANA_READ_TOKEN, and N8N_INGEST_TOKEN repository secrets are configured."
            exit 0
          fi
          node scripts/deploy-cloudflare.mjs
