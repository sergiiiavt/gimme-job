name: Code quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Diagnose existing Sonar main gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request
          
          project = "sergiiiavt_gimme-job"
          token = os.environ.get("SONAR_TOKEN", "")
          auth = base64.b64encode(f"{token}:".encode()).decode()
          
          def get(path, params):
              query = urllib.parse.urlencode(params)
              url = f"https://sonarcloud.io/api/{path}?{query}"
              req = urllib.request.Request(url, headers={"Authorization": f"Basic {auth}"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)
          
          try:
              result = get("qualitygates/project_status", {"projectKey": project, "branch": "main"})
              gate = result.get("projectStatus", {})
              print("MAIN QUALITY GATE:", gate.get("status"), flush=True)
              for condition in gate.get("conditions", []):
                  if condition.get("status") == "ERROR":
                      print("FAILED:", condition, flush=True)
          except Exception as e:
              print("MAIN GATE ERROR:", type(e).__name__, str(e), flush=True)
          
          for label, extra in [
              ("MAIN NEW-CODE ISSUES", {"sinceLeakPeriod": "true"}),
              ("MAIN ALL OPEN ISSUES", {}),
          ]:
              try:
                  payload = get("issues/search", {
                      "componentKeys": project, "branch": "main",
                      "resolved": "false", "ps": 500, **extra,
                  })
                  issues = payload.get("issues", [])
                  print(label, "total:", payload.get("total"), "returned:", len(issues), flush=True)
                  for issue in issues[:100]:
                      print(
                          "ISSUE:",
                          issue.get("type"), issue.get("severity"), issue.get("rule"),
                          issue.get("component"), issue.get("line"), issue.get("message"),
                          "impacts=", issue.get("impacts"),
                          flush=True,
                      )
              except Exception as e:
                  print(label, "ERROR:", type(e).__name__, str(e), flush=True)
          PY
      - name: Use Node.js 22.22
        uses: actions/setup-node@v7
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        run: npm run verify

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ai-service/pyproject.toml
            ai-service/uv.lock

      - name: Install uv
        run: python -m pip install uv==0.12.1

      - name: Verify committed AI service lock
        run: uv lock --project ai-service --check

      - name: Install AI service test dependencies
        run: uv sync --project ai-service --frozen --extra test --no-build --no-install-project

      - name: Verify AI service with coverage
        env:
          PYTHONPATH: ai-service/src
        run: |
          ai-service/.venv/bin/python -m coverage run --rcfile=ai-service/pyproject.toml -m unittest discover -s ai-service/tests -v
          ai-service/.venv/bin/python -m coverage report --rcfile=ai-service/pyproject.toml --fail-under=80
          ai-service/.venv/bin/python -m coverage xml --rcfile=ai-service/pyproject.toml
          rm -f .coverage ai-service/.coverage
          find ai-service -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify committed LLM testing examples lock
        run: uv lock --project examples/llm-testing --check

      - name: Verify LLM testing course examples
        run: |
          uv sync --project examples/llm-testing --frozen --no-build
          examples/llm-testing/.venv/bin/python -m pytest examples/llm-testing -q
          rm -rf examples/llm-testing/.venv
          find examples/llm-testing -type d -name __pycache__ -prune -exec rm -rf {} +

      # Dependabot runs receive no repository secrets; main is re-analyzed after merge.
      - name: SonarQube Cloud quality gate
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
            -Dsonar.tests=tests,ai-service/tests
            -Dsonar.test.inclusions=tests/**,ai-service/tests/**
            -Dsonar.python.coverage.reportPaths=ai-service/coverage.xml
            -Dsonar.python.version=3.12,3.13,3.14
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Diagnose SonarQube Cloud failure
        if: failure()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY' | tee sonar-diagnostics.txt
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          base_url = "https://sonarcloud.io/api"
          project_key = "sergiiiavt_gimme-job"
          pr_number = os.environ["PR_NUMBER"]
          token = os.environ.get("SONAR_TOKEN", "")
          auth = base64.b64encode(f"{token}:".encode()).decode()

          def request(path, params):
              url = f"{base_url}/{path}?{urllib.parse.urlencode(params)}"
              req = urllib.request.Request(url, headers={"Authorization": f"Basic {auth}"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          try:
              status_payload = request(
                  "qualitygates/project_status",
                  {"projectKey": project_key, "pullRequest": pr_number},
              )
              project_status = status_payload.get("projectStatus", {})
              print(f"Quality gate: {project_status.get('status', 'UNKNOWN')}")
              for condition in project_status.get("conditions", []):
                  if condition.get("status") == "ERROR":
                      print(
                          "Failed condition: "
                          f"metric={condition.get('metricKey')} "
                          f"actual={condition.get('actualValue')} "
                          f"operator={condition.get('comparator')} "
                          f"threshold={condition.get('errorThreshold')}"
                      )

              issues_payload = request(
                  "issues/search",
                  {
                      "componentKeys": project_key,
                      "pullRequest": pr_number,
                      "resolved": "false",
                      "types": "VULNERABILITY",
                      "ps": 100,
                  },
              )
              issues = issues_payload.get("issues", [])
              print(f"Open vulnerabilities: {len(issues)}")
              for issue in issues:
                  print(
                      "Vulnerability: "
                      f"rule={issue.get('rule')} "
                      f"severity={issue.get('severity')} "
                      f"component={issue.get('component')} "
                      f"line={issue.get('line')} "
                      f"message={issue.get('message')}"
                  )

              bugs_payload = request(
                  "issues/search",
                  {
                      "componentKeys": project_key,
                      "pullRequest": pr_number,
                      "resolved": "false",
                      "types": "BUG",
                      "ps": 100,
                  },
              )
              bugs = bugs_payload.get("issues", [])
              print(f"Open reliability bugs: {len(bugs)}")
              for issue in bugs:
                  print(
                      "Reliability bug: "
                      f"rule={issue.get('rule')} "
                      f"severity={issue.get('severity')} "
                      f"component={issue.get('component')} "
                      f"line={issue.get('line')} "
                      f"message={issue.get('message')}"
                  )
          except Exception as error:
              print(f"Sonar diagnostics unavailable: {type(error).__name__}: {error}")
          PY

      - name: Upload Sonar diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sonar-diagnostics
          path: sonar-diagnostics.txt
          if-no-files-found: ignore
          retention-days: 1

  sonar-main:
    name: Refresh Sonar main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v7
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for coverage-backed analysis
        run: npm run build

      - name: Collect coverage
        run: npm run test:coverage

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            ai-service/pyproject.toml
            ai-service/uv.lock

      - name: Install uv
        run: python -m pip install uv==0.12.1

      - name: Verify committed AI service lock
        run: uv lock --project ai-service --check

      - name: Install AI service test dependencies
        run: uv sync --project ai-service --frozen --extra test --no-build --no-install-project

      - name: Collect AI service coverage
        env:
          PYTHONPATH: ai-service/src
        run: |
          ai-service/.venv/bin/python -m coverage run --rcfile=ai-service/pyproject.toml -m unittest discover -s ai-service/tests -v
          ai-service/.venv/bin/python -m coverage report --rcfile=ai-service/pyproject.toml --fail-under=80
          ai-service/.venv/bin/python -m coverage xml --rcfile=ai-service/pyproject.toml
          rm -f .coverage ai-service/.coverage
          find ai-service -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Refresh SonarQube Cloud main branch
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >
            -Dsonar.tests=tests,ai-service/tests
            -Dsonar.test.inclusions=tests/**,ai-service/tests/**
            -Dsonar.python.coverage.reportPaths=ai-service/coverage.xml
            -Dsonar.python.version=3.12,3.13,3.14
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}