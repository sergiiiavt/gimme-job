name: Code quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify repository
        run: npm run verify

      - name: Use Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-service/pyproject.toml

      - name: Install AI service
        run: python -m pip install ./ai-service

      - name: Verify AI service
        run: python -m unittest discover -s ai-service/tests -v

      - name: SonarQube Cloud quality gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  sonar-main:
    name: Refresh Sonar main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build for coverage-backed analysis
        run: npm run build

      - name: Collect coverage
        run: npm run test:coverage

      - name: Refresh SonarQube Cloud main branch
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
