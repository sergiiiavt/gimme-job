name: CI and Cloudflare deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Type-check local agent
        run: npm run check:agent

      - name: Verify Drizzle schema and migration metadata
        shell: bash
        run: |
          npm run db:generate
          git diff --exit-code -- db/schema.ts drizzle

      - name: Validate interview content
        run: npm run check:content

      - name: Validate Rewild visual assets
        run: npm run check:rewild-assets

      - name: Build production artifact
        run: npm run build

      - name: Test with LCOV coverage
        run: npm run test:coverage

      - name: Validate Cloudflare deployment artifact
        run: npm run check:cloudflare

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Deploy Worker and D1
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          APP_PASSWORD: ${{ secrets.APP_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GMAIL_TOKEN_ENCRYPTION_KEY: ${{ secrets.GMAIL_TOKEN_ENCRYPTION_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GRAFANA_READ_TOKEN: ${{ secrets.GRAFANA_READ_TOKEN }}
          MULTI_USER_ENABLED: ${{ vars.MULTI_USER_ENABLED }}
          N8N_INGEST_TOKEN: ${{ secrets.N8N_INGEST_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        shell: bash
        run: |
          if [[ -z "$APP_PASSWORD" || -z "$CLOUDFLARE_ACCOUNT_ID" || -z "$CLOUDFLARE_API_TOKEN" || -z "$GRAFANA_READ_TOKEN" || -z "$N8N_INGEST_TOKEN" ]]; then
            echo "::notice::Cloudflare deployment skipped until APP_PASSWORD, CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN, GRAFANA_READ_TOKEN, and N8N_INGEST_TOKEN repository secrets are configured."
            exit 0
          fi
          node scripts/deploy-cloudflare.mjs
