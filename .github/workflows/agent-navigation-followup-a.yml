name: Agent navigation follow-up A

on:
  push:
    branches:
      - agent/navigation-followup-a

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Apply navigation follow-up changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual < count:
                  raise SystemExit(f"{path}: expected at least {count} occurrence(s), found {actual}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          # Task 1 + Task 2: make navigation-config the complete, live data owner.
          p = Path("app/navigation-config.ts")
          text = p.read_text()
          text = text.replace(
              '''export interface SectionNavigationItem {\n  id: SiteSection;\n  label: string;\n  external?: false;\n  publicHref?: string;\n  personalHref?: string;\n}\n\nexport interface ExternalNavigationItem {\n  id: ExternalNavigationId;\n  label: string;\n  external: true;\n  publicHref: string;\n  personalHref: string;\n}\n''',
              '''export interface SectionNavigationItem {\n  id: SiteSection;\n  label: string;\n  external?: false;\n}\n\nexport interface ExternalNavigationItem {\n  id: ExternalNavigationId;\n  label: string;\n  external: true;\n  publicHref: string;\n}\n''',
          )
          text = text.replace(
              '''export const navigationIntroItem: SectionNavigationItem = {\n  id: "about",\n  label: "About this site",\n  publicHref: "/about",\n  personalHref: "/about",\n};\n''',
              '''export const navigationIntroItem: SectionNavigationItem = {\n  id: "about",\n  label: "About this site",\n};\n''',
          )
          text = text.replace(
              '{ id: "programming", label: "Programming", publicHref: "/learn/programming", personalHref: "/workspace/learn/programming" },',
              '{ id: "programming", label: "Programming" },',
          )
          text = text.replace(
              '{ id: "automation", label: "Test automation", publicHref: "/learn/automation", personalHref: "/workspace/learn/automation" },',
              '{ id: "automation", label: "Test automation" },',
          )
          text = text.replace(
              '{ id: "devops", label: "Cloud & DevOps", publicHref: "/learn/cloud-devops", personalHref: "/workspace/learn/cloud-devops" },',
              '{ id: "devops", label: "Cloud & DevOps" },',
          )
          text = re.sub(r'^\s*personalHref: ".*",\n', '', text, flags=re.MULTILINE)
          marker = '''export interface NavigationGroup {\n  id: NavigationGroupId;\n  label: string;\n  items: NavigationItem[];\n}\n\n'''
          clusters = '''export type LearningClusterTone = "foundation" | "ai" | "build" | "systems" | "infra" | "governance";\n\nexport interface LearningCluster {\n  tone: LearningClusterTone;\n  itemIds: Array<NavigationItem["id"]>;\n}\n\nexport const learningClusters: LearningCluster[] = [\n  { tone: "foundation", itemIds: ["qa-fundamentals", "certifications"] },\n  { tone: "ai", itemIds: ["llm", "agentic"] },\n  { tone: "build", itemIds: ["programming", "automation", "testing-tools"] },\n  { tone: "systems", itemIds: ["api", "data", "mobile", "embedded"] },\n  { tone: "infra", itemIds: ["performance", "security", "devops", "observability", "networking", "linux"] },\n  { tone: "governance", itemIds: ["standards", "metrics-estimation", "strategy"] },\n];\n\n'''
          if marker not in text:
              raise SystemExit("navigation-config.ts: NavigationGroup marker not found")
          text = text.replace(marker, marker + clusters, 1)
          p.write_text(text)

          # Task 2: consume cluster data from the pure config instead of duplicating it in TSX.
          p = Path("app/site-navigation.tsx")
          text = p.read_text()
          text = text.replace(
              '''import {\n  navigationGroups,\n  navigationIntroItem,\n''',
              '''import {\n  learningClusters,\n  navigationGroups,\n  navigationIntroItem,\n''',
              1,
          )
          text, n = re.subn(
              r'type LearningClusterTone = "foundation"[\s\S]*?const learningClusters: LearningCluster\[\] = \[[\s\S]*?\];\n\n(?=export interface SubnavItem)',
              '',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"site-navigation.tsx: expected to remove one local learningClusters block, removed {n}")
          p.write_text(text)

          # Navigation config tests: assert the actual render-order seam, not mirror derivations.
          Path("tests/navigation-config.test.ts").write_text('''import assert from "node:assert/strict";\nimport test from "node:test";\nimport {\n  learningClusters,\n  navigationGroups,\n  navigationIntroItem,\n} from "../app/navigation-config.ts";\n\nfunction group(id: (typeof navigationGroups)[number]["id"]) {\n  const value = navigationGroups.find((candidate) => candidate.id === id);\n  assert.ok(value, `${id} navigation group must exist`);\n  return value;\n}\n\nfunction item(groupId: (typeof navigationGroups)[number]["id"], itemId: string) {\n  const value = group(groupId).items.find((candidate) => candidate.id === itemId);\n  assert.ok(value, `${itemId} must exist in ${groupId}`);\n  return value;\n}\n\ntest("navigation keeps the intended group and item structure", () => {\n  assert.equal(navigationIntroItem.id, "about");\n  assert.deepEqual(navigationGroups.map((entry) => entry.id), ["career", "playgrounds", "learning", "misc"]);\n  assert.deepEqual(group("career").items.map((entry) => entry.id), ["jobs", "resume", "interview", "trends"]);\n  assert.equal(group("playgrounds").label, "Playground");\n  assert.deepEqual(group("playgrounds").items.map((entry) => entry.id), ["ai-assistant", "websocket-playground", "database-playground"]);\n  assert.deepEqual(group("misc").items.map((entry) => entry.id), ["news", "games"]);\n  assert.deepEqual(\n    learningClusters.flatMap((cluster) => cluster.itemIds),\n    group("learning").items.map((entry) => entry.id),\n    "every learning item must appear in exactly one cluster, in render order",\n  );\n\n  const allIds = [navigationIntroItem.id, ...navigationGroups.flatMap((entry) => entry.items.map((navItem) => navItem.id))];\n  assert.equal(new Set(allIds).size, allIds.length, "navigation IDs must be unique");\n  assert.ok(navigationIntroItem.label.trim().length > 0);\n  assert.ok(navigationGroups.every((entry) => entry.label.trim().length > 0));\n  assert.ok(navigationGroups.flatMap((entry) => entry.items).every((navItem) => navItem.label.trim().length > 0));\n});\n\ntest("external navigation items keep canonical destinations independent of display copy", () => {\n  const assistant = item("playgrounds", "ai-assistant");\n  const websocket = item("playgrounds", "websocket-playground");\n  const database = item("playgrounds", "database-playground");\n  const games = item("misc", "games");\n\n  assert.equal(assistant.external, true);\n  assert.equal(assistant.publicHref, "/ai-assistant");\n  assert.equal(websocket.external, true);\n  assert.equal(websocket.publicHref, "/playgrounds/websocket");\n  assert.equal(database.external, true);\n  assert.equal(database.publicHref, "/playgrounds/databases");\n  assert.equal(games.external, true);\n  assert.equal(games.publicHref, "/games");\n});\n''')

          # Task 4 + Task 5: recursive ownership guard over both source files; remove dead placeholder contract.
          Path("tests/navigation-source-ownership.test.mjs").write_text('''import assert from "node:assert/strict";\nimport { readdir, readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst TEST_DIRECTORY = new URL("./", import.meta.url);\nconst SELF = "navigation-source-ownership.test.mjs";\nconst allowedNavigationSourceContracts = [\n  "auth-forwarding-ui.test.mjs",\n  "learning-path-advisor-render.test.mjs",\n  "navigation-config.test.ts",\n].sort();\n\ntest("only dedicated navigation contracts may inspect navigation implementation sources", async () => {\n  const files = (await readdir(TEST_DIRECTORY, { recursive: true }))\n    .map((name) => name.replaceAll("\\\\", "/"))\n    .filter((name) => /\\.test\\.(?:[cm]?js|[cm]?ts)$/.test(name) && name !== SELF);\n\n  const readers = [];\n  for (const file of files) {\n    const source = await readFile(new URL(file, TEST_DIRECTORY), "utf8");\n    if (source.includes("app/site-navigation.tsx") || source.includes("app/navigation-config.ts")) readers.push(file);\n  }\n\n  assert.deepEqual(\n    readers.sort(),\n    allowedNavigationSourceContracts,\n    "Navigation copy/order belongs in navigation-config tests. Add a source reader here only for navigation implementation details that cannot be expressed through exported config. The guard intentionally does not scan common label literals because that would create noisy false positives; catch literal-copy coupling in review.",\n  );\n});\n''')
          Path("tests/next-game-placeholder.test.mjs").unlink()

          # Task 7a: decouple the vacancy accessibility contract from JSX line breaks.
          replace(
              "tests/vacancy-ui-source-contract.test.mjs",
              '  assert.match(privateJobsSource, /className="job-card"\\s*\\n\\s*role="button"/);',
              '  assert.match(privateJobsSource, /className="job-card"/);\n  assert.match(privateJobsSource, /role="button"/);',
          )

          # Task 7b: give routing and CSS hooks separate test ownership names.
          Path("tests/site-shell-source-contract.test.mjs").write_text('''import assert from "node:assert/strict";\nimport { readFile } from "node:fs/promises";\nimport test from "node:test";\n\nconst read = (path) => readFile(new URL(`../${path}`, import.meta.url), "utf8");\n\ntest("site shell keeps sidebar layout hooks", async () => {\n  const stylesSource = await read("app/globals.css");\n\n  assert.match(stylesSource, /\\.kb-area-group-career/);\n  assert.match(stylesSource, /\\.kb-area-group-learning/);\n  assert.match(stylesSource, /\\.kb-area-group-misc/);\n  assert.match(stylesSource, /\\.kb-nav-intro/);\n  assert.match(stylesSource, /\\.kb-navigation \\.kb-nav-list \\.kb-nav-link \\{[^}]*font-size: 12px/);\n});\n\ntest("site shell keeps canonical section routing", async () => {\n  const uiSource = await read("app/public-site.tsx");\n\n  assert.match(uiSource, /window\\.location\\.assign\\(sectionNavigationHref\\(next, effectiveMode\\)\\)/);\n  assert.match(uiSource, /if \\(section === "about"\\) return <AboutSite mode=\\{mode\\}\\/>/);\n  assert.match(uiSource, /if \\(section === "resume"\\) return <ResumePage mode=\\{mode\\}\\/>/);\n  assert.match(uiSource, /const section = useMemo\\(\\(\\) => resolveSection\\(pathname, hash\\), \\[pathname, hash\\]\\)/);\n  assert.match(uiSource, /embedded: \\{[\\s\\S]*?title: "Embedded & IoT QA"/);\n});\n''')

          # Task 7c: scope the behavior-first preference to new tests.
          replace(
              "AGENTS.md",
              "- Prefer testing exported functions, configuration, rendered output, API responses, or generated artifacts over regex-matching implementation source.",
              "- Prefer testing exported functions, configuration, rendered output, API responses, or generated artifacts over regex-matching implementation source. This applies to new tests; existing source contracts migrate opportunistically when their area is touched.",
          )
          PY

      - name: Install dependencies
        run: npm ci

      - name: Fast verification
        run: npm run verify:fast

      - name: Focused navigation verification
        shell: bash
        run: |
          npx tsc -p tsconfig.json --noEmit
          node --test tests/navigation-config.test.ts tests/navigation-paths.test.ts
          node --test tests/navigation-source-ownership.test.mjs
          node --test tests/vacancy-ui-source-contract.test.mjs tests/site-shell-source-contract.test.mjs
          if grep -rn "personalHref" app/ | grep -vE 'learning-document-page\.tsx|public-site\.tsx|site-navigation\.tsx'; then
            echo "Unexpected personalHref usage remains under app/" >&2
            exit 1
          fi

      - name: Mutation-check learning cluster parity
        shell: bash
        run: |
          cp app/navigation-config.ts /tmp/navigation-config.ts
          python <<'PY'
          from pathlib import Path
          p = Path("app/navigation-config.ts")
          text = p.read_text()
          needle = '      { id: "strategy", label: "Strategy & leadership" },\n'
          if needle not in text:
              raise SystemExit("strategy item marker not found")
          p.write_text(text.replace(needle, needle + '      { id: "about", label: "Temporary orphan" },\n', 1))
          PY
          if node --test tests/navigation-config.test.ts; then
            echo "Expected learning-cluster parity mutation to fail" >&2
            exit 1
          fi
          cp /tmp/navigation-config.ts app/navigation-config.ts

      - name: Mutation-check navigation source ownership
        shell: bash
        run: |
          cat > tests/navigation-config-source-temp.test.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          readFileSync(new URL("../app/navigation-config.ts", import.meta.url), "utf8");
          EOF
          if node --test tests/navigation-source-ownership.test.mjs; then
            echo "Expected navigation-config source mutation to fail ownership guard" >&2
            exit 1
          fi
          rm tests/navigation-config-source-temp.test.mjs

          mkdir -p tests/performance
          cat > tests/performance/navigation-source-temp.test.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          readFileSync(new URL("../../app/site-navigation.tsx", import.meta.url), "utf8");
          EOF
          if node --test tests/navigation-source-ownership.test.mjs; then
            echo "Expected recursive site-navigation source mutation to fail ownership guard" >&2
            exit 1
          fi
          rm tests/performance/navigation-source-temp.test.mjs

      - name: Full verification
        run: npm run verify

      - name: Commit verified implementation
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/agent-navigation-followup-a.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md app/navigation-config.ts app/site-navigation.tsx tests/navigation-config.test.ts tests/navigation-source-ownership.test.mjs tests/vacancy-ui-source-contract.test.mjs tests/site-shell-source-contract.test.mjs tests/next-game-placeholder.test.mjs
          git commit -m "Finish navigation test decoupling"
          git push origin HEAD:agent/navigation-followup-a
