name: DOU vacancy sync

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  workflow_run:
    workflows: ["CI and Cloudflare deploy"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: dou-vacancy-sync
  cancel-in-progress: true

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Use Node.js 22.22
        uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Collect DOU and import to production
        env:
          N8N_INGEST_TOKEN: ${{ secrets.N8N_INGEST_TOKEN }}
        run: node --import tsx scripts/sync-dou-vacancies.ts
