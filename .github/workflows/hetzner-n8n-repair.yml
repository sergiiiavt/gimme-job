name: Refresh Hetzner runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/hetzner-n8n-repair.yml
      - ops/hetzner/bootstrap.sh
      - ops/hetzner/docker-compose.yml
      - ops/hetzner/Caddyfile
      - ops/hetzner/db-lab/**
      - ops/hetzner/db-lab-api/**
      - ops/hetzner/mongo-lab-api/**
  workflow_dispatch:

permissions:
  contents: read

# Share this lock only with the AI SSH deployment: both mutate/reboot the live runtime.
# Provider-only Hetzner reconciliation uses a separate concurrency group.
concurrency:
  group: ai-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      HETZNER_TOKEN: ${{ secrets.HETZNER_TOKEN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Hetzner token
        shell: bash
        run: |
          if [[ -z "$HETZNER_TOKEN" ]]; then
            echo "HETZNER_TOKEN repository secret is missing." >&2
            exit 1
          fi

      - name: Reconcile Hetzner firewall and DNS
        run: node ops/hetzner/provision.mjs

      - name: Boot temporary Hetzner rescue system
        run: node ops/hetzner/repair-rescue.mjs

      - name: Install rescue SSH client helper
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Wait for rescue SSH
        shell: bash
        env:
          SSHPASS: ${{ env.HETZNER_RESCUE_PASSWORD }}
        run: |
          for attempt in $(seq 1 60); do
            if sshpass -e ssh \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=5 \
              -o ConnectionAttempts=1 \
              root@$HETZNER_SERVER_IP 'true' >/dev/null 2>&1; then
              echo "Hetzner rescue SSH accepts authenticated sessions"
              sleep 2
              exit 0
            fi
            echo "Waiting for authenticated rescue SSH ($attempt/60)..."
            sleep 5
          done
          echo "Rescue SSH did not become ready for authenticated sessions." >&2
          exit 1

      - name: Install current runtime bootstrap from rescue system
        shell: bash
        env:
          SSHPASS: ${{ env.HETZNER_RESCUE_PASSWORD }}
        run: |
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=10 \
            root@$HETZNER_SERVER_IP 'bash -s' <<'REMOTE'
          set -euo pipefail

          ROOT_DEV="$(lsblk -b -rpno NAME,TYPE,FSTYPE,SIZE,MOUNTPOINTS \
            | awk '$2 == "part" && ($3 == "ext4" || $3 == "xfs") && $5 == "" { print $4, $1 }' \
            | sort -nr \
            | head -n1 \
            | awk '{print $2}')"

          if [[ -z "$ROOT_DEV" ]]; then
            echo "Could not identify the installed Ubuntu root partition." >&2
            lsblk -f
            exit 1
          fi

          echo "Installed root partition: $ROOT_DEV"
          mkdir -p /mnt
          mount "$ROOT_DEV" /mnt

          echo "--- previous bootstrap log (sanitized tail) ---"
          if [[ -f /mnt/var/log/gimmejob-bootstrap.log ]]; then
            tail -n 120 /mnt/var/log/gimmejob-bootstrap.log \
              | sed -E 's/(POSTGRES_PASSWORD|N8N_ENCRYPTION_KEY|MYSQL_LAB_ROOT_PASSWORD|POSTGRES_LAB_ADMIN_PASSWORD|MONGO_LAB_ADMIN_PASSWORD)=.*/\1=[REDACTED]/g'
          else
            echo "No previous gimmejob-bootstrap.log found"
          fi

          install -d -m 755 /mnt/usr/local/sbin
          curl --retry 8 --retry-all-errors --retry-delay 3 -fsSL \
            https://raw.githubusercontent.com/sergiiiavt/gimme-job/main/ops/hetzner/bootstrap.sh \
            -o /mnt/usr/local/sbin/gimmejob-bootstrap.sh
          chmod 700 /mnt/usr/local/sbin/gimmejob-bootstrap.sh

          cat >/mnt/etc/systemd/system/gimmejob-bootstrap.service <<'UNIT'
          [Unit]
          Description=GimmeJob Hetzner runtime bootstrap
          Wants=network-online.target
          After=network-online.target

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/gimmejob-bootstrap.sh
          TimeoutStartSec=900
          RemainAfterExit=yes
          StandardOutput=append:/var/log/gimmejob-bootstrap.log
          StandardError=append:/var/log/gimmejob-bootstrap.log

          [Install]
          WantedBy=multi-user.target
          UNIT

          install -d -m 755 /mnt/etc/systemd/system/multi-user.target.wants
          ln -sfn ../gimmejob-bootstrap.service \
            /mnt/etc/systemd/system/multi-user.target.wants/gimmejob-bootstrap.service

          rm -f /mnt/opt/gimmejob-n8n/.bootstrap-complete
          sync
          umount /mnt

          echo "Runtime refresh installed. Rebooting into Ubuntu..."
          nohup sh -c 'sleep 2; reboot' >/dev/null 2>&1 &
          REMOTE

      - name: Wait for n8n HTTPS
        shell: bash
        run: |
          sleep 15
          for attempt in $(seq 1 90); do
            if curl --fail --silent --show-error --max-time 10 \
              --resolve n8n.gimme-job.com:443:$HETZNER_SERVER_IP \
              https://n8n.gimme-job.com/ >/dev/null; then
              echo "n8n HTTPS is healthy: https://n8n.gimme-job.com"
              exit 0
            fi
            echo "Waiting for Ubuntu bootstrap, Docker, n8n, Caddy and ACME TLS ($attempt/90)..."
            sleep 10
          done
          echo "n8n HTTPS did not become healthy within 15 minutes." >&2
          exit 1

      - name: Verify database ports are private
        shell: bash
        run: |
          for port in 3306 5432 27017 8080 8081; do
            if timeout 3 bash -c "</dev/tcp/$HETZNER_SERVER_IP/$port" 2>/dev/null; then
              echo "Database service is unexpectedly public on port $port." >&2
              exit 1
            fi
            echo "Database service port $port is not publicly reachable."
          done

      - name: Wait for SQL database lab API health
        shell: bash
        run: |
          body=""
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 20 \
              --resolve ai.gimme-job.com:443:$HETZNER_SERVER_IP \
              https://ai.gimme-job.com/db-lab/health 2>/dev/null || true)"
            if grep -Fq '"status":"ok"' <<<"$body"; then
              echo "SQL database lab API is healthy behind Caddy."
              exit 0
            fi
            echo "Waiting for SQL database lab API ($attempt/60)..."
            sleep 5
          done
          echo "SQL database lab API did not become healthy. Last response: ${body:-no response}" >&2
          exit 1

      - name: Wait for MongoDB lab API health
        shell: bash
        run: |
          body=""
          for attempt in $(seq 1 60); do
            body="$(curl --silent --show-error --max-time 20 \
              --resolve ai.gimme-job.com:443:$HETZNER_SERVER_IP \
              https://ai.gimme-job.com/mongo-lab/health 2>/dev/null || true)"
            if grep -Fq '"status":"ok"' <<<"$body" && grep -Fq '"mongodb":true' <<<"$body"; then
              echo "MongoDB lab API is healthy behind Caddy."
              exit 0
            fi
            echo "Waiting for MongoDB lab API ($attempt/60)..."
            sleep 5
          done
          echo "MongoDB lab API did not become healthy. Last response: ${body:-no response}" >&2
          exit 1

      - name: Verify database labs require service authentication
        shell: bash
        run: |
          for base in db-lab mongo-lab; do
            for action in query schema reset; do
              status="$(curl --silent --show-error --max-time 20 \
                --resolve ai.gimme-job.com:443:$HETZNER_SERVER_IP \
                -o /dev/null -w '%{http_code}' \
                -H 'Content-Type: application/json' -d '{}' \
                "https://ai.gimme-job.com/$base/v1/$action")"
              if [[ "$status" != "401" ]]; then
                echo "$base $action returned $status instead of 401 without a service token." >&2
                exit 1
              fi
            done
          done

      - name: Verify public database playground end to end
        shell: bash
        run: |
          mysql_sessions=(
            deploy-smoke-shard-0
            deploy-smoke-shard-1
            deploy-smoke-shard-2
            deploy-smoke-shard-3
          )

          for session_id in "${mysql_sessions[@]}"; do
            payload="$(printf '{"action":"query","engine":"mysql","sessionId":"%s","sql":"SELECT id, status FROM orders ORDER BY id LIMIT 1;"}' "$session_id")"
            body=""
            passed=false
            for attempt in $(seq 1 30); do
              body="$(curl --silent --show-error --max-time 30 \
                -H 'Content-Type: application/json' \
                -d "$payload" \
                https://gimme-job.com/api/playgrounds/databases 2>/dev/null || true)"
              if grep -Fq '"rowCount":1' <<<"$body" \
                && grep -Fq '"columns":["id","status"]' <<<"$body" \
                && grep -Fq '"rows":[["1","new"]]' <<<"$body"; then
                echo "MySQL seeded-row query passed for $session_id."
                passed=true
                break
              fi
              echo "Waiting for MySQL seeded rows in $session_id ($attempt/30)..."
              sleep 5
            done
            if [[ "$passed" != true ]]; then
              echo "MySQL database playground seeded-row query failed for $session_id. Last response: ${body:-no response}" >&2
              exit 1
            fi
          done

          payload="$(printf '{"action":"query","engine":"postgres","sessionId":"deploy-smoke-%s","sql":"SELECT 1 AS ok;"}' "$GITHUB_RUN_ID")"
          body=""
          passed=false
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --max-time 30 \
              -H 'Content-Type: application/json' \
              -d "$payload" \
              https://gimme-job.com/api/playgrounds/databases 2>/dev/null || true)"
            if grep -Fq '"rowCount":1' <<<"$body" && grep -Fq '"ok"' <<<"$body"; then
              echo "PostgreSQL database playground query passed."
              passed=true
              break
            fi
            echo "Waiting for PostgreSQL public database playground ($attempt/30)..."
            sleep 5
          done
          if [[ "$passed" != true ]]; then
            echo "PostgreSQL database playground query failed. Last response: ${body:-no response}" >&2
            exit 1
          fi

          mongo_payload="$(printf '{"action":"query","engine":"mongodb","sessionId":"deploy-mongo-%s","sql":"db.orders.find({\\"orderId\\":1},{\\"orderId\\":1,\\"status\\":1,\\"_id\\":0}).limit(1);"}' "$GITHUB_RUN_ID")"
          body=""
          passed=false
          for attempt in $(seq 1 30); do
            body="$(curl --silent --show-error --max-time 30 \
              -H 'Content-Type: application/json' \
              -d "$mongo_payload" \
              https://gimme-job.com/api/playgrounds/databases 2>/dev/null || true)"
            if grep -Fq '"statementType":"FIND"' <<<"$body" \
              && grep -Fq '"rowCount":1' <<<"$body" \
              && grep -Fq '"orderId":1' <<<"$body"; then
              echo "MongoDB database playground query passed."
              passed=true
              break
            fi
            echo "Waiting for MongoDB public database playground ($attempt/30)..."
            sleep 5
          done
          if [[ "$passed" != true ]]; then
            echo "MongoDB database playground query failed. Last response: ${body:-no response}" >&2
            exit 1
          fi
