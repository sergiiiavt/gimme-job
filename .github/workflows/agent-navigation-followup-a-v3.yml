name: Agent navigation follow-up A v3

on:
  push:
    branches:
      - agent/navigation-followup-a

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
      - name: Apply implementation patch
        shell: bash
        run: |
          git show 5358df07552465979f02927bd1abad012b12554f:.github/workflows/agent-navigation-followup-a.yml > /tmp/original.yml
          python <<'PY'
          from pathlib import Path
          lines = Path('/tmp/original.yml').read_text().splitlines()
          step = lines.index('      - name: Apply navigation follow-up changes')
          run = next(i for i in range(step + 1, len(lines)) if lines[i] == '        run: |')
          end = next(i for i in range(run + 1, len(lines)) if lines[i] == '      - name: Install dependencies')
          block = [line[10:] if line.startswith('          ') else line for line in lines[run + 1:end]]
          Path('/tmp/apply.sh').write_text('\n'.join(block) + '\n')
          PY
          bash /tmp/apply.sh
      - run: npm ci
      - name: Fast verification
        run: npm run verify:fast
      - name: Focused verification
        shell: bash
        run: |
          node --test tests/navigation-config.test.ts tests/navigation-paths.test.ts
          node --test tests/navigation-source-ownership.test.mjs
          node --test tests/vacancy-ui-source-contract.test.mjs tests/site-shell-source-contract.test.mjs
          if grep -n "personalHref" app/navigation-config.ts; then
            echo "navigation-config.ts still contains dead personalHref data" >&2
            exit 1
          fi
          set +e
          npx tsc -p tsconfig.json --noEmit > /tmp/tsc.log 2>&1
          tsc_status=$?
          set -e
          if [ "$tsc_status" -ne 0 ]; then
            if grep -E '^app/(navigation-config|site-navigation)\.(ts|tsx)' /tmp/tsc.log; then
              cat /tmp/tsc.log
              echo "Navigation TypeScript diagnostics detected" >&2
              exit 1
            fi
            echo "Full tsconfig typecheck remains red on unrelated baseline diagnostics; npm run check:agent is green."
          fi
      - name: Mutation checks
        shell: bash
        run: |
          cp app/navigation-config.ts /tmp/navigation-config.ts
          python <<'PY'
          from pathlib import Path
          p = Path('app/navigation-config.ts')
          text = p.read_text()
          needle = '      { id: "strategy", label: "Strategy & leadership" },\n'
          if needle not in text:
              raise SystemExit('strategy marker not found')
          p.write_text(text.replace(needle, needle + '      { id: "about", label: "Temporary orphan" },\n', 1))
          PY
          if node --test tests/navigation-config.test.ts; then
            echo "Expected learning cluster parity mutation to fail" >&2
            exit 1
          fi
          cp /tmp/navigation-config.ts app/navigation-config.ts

          cat > tests/navigation-config-source-temp.test.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          readFileSync(new URL("../app/navigation-config.ts", import.meta.url), "utf8");
          EOF
          if node --test tests/navigation-source-ownership.test.mjs; then
            echo "Expected config source reader to fail ownership guard" >&2
            exit 1
          fi
          rm tests/navigation-config-source-temp.test.mjs

          cat > tests/performance/navigation-source-temp.test.mjs <<'EOF'
          import { readFileSync } from "node:fs";
          readFileSync(new URL("../../app/site-navigation.tsx", import.meta.url), "utf8");
          EOF
          if node --test tests/navigation-source-ownership.test.mjs; then
            echo "Expected nested source reader to fail ownership guard" >&2
            exit 1
          fi
          rm tests/performance/navigation-source-temp.test.mjs
      - name: Full verification
        run: npm run verify
      - name: Commit verified implementation
        shell: bash
        run: |
          git diff --check
          git rm .github/workflows/agent-navigation-followup-a-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- AGENTS.md app/navigation-config.ts app/site-navigation.tsx tests/navigation-config.test.ts tests/navigation-source-ownership.test.mjs tests/vacancy-ui-source-contract.test.mjs tests/site-shell-source-contract.test.mjs tests/next-game-placeholder.test.mjs
          git commit -m "Finish navigation test decoupling"
          git push origin HEAD:agent/navigation-followup-a
