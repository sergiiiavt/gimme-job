name: Fix database playground syntax

on:
  push:
    branches:
      - agent/database-playground
    paths:
      - .github/workflows/fix-db-playground-syntax.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/database-playground

      - name: Fix UI syntax and sidecar lint warning
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('app/playgrounds/databases/database-playground.tsx')
          text = ui.read_text()
          old = '''    return value.filter((item): item is HistoryItem => Boolean(
      item && typeof item === "object" && !Array.isArray(item)
      && typeof (item as HistoryItem).sql === "string"
      && ((item as HistoryItem).engine === "mysql" || (item as HistoryItem).engine === "postgres"),
    ).slice(0, 50);'''
          new = '''    return value.filter((item): item is HistoryItem => Boolean(
      item && typeof item === "object" && !Array.isArray(item)
      && typeof (item as HistoryItem).sql === "string"
      && ((item as HistoryItem).engine === "mysql" || (item as HistoryItem).engine === "postgres")
    )).slice(0, 50);'''
          if old not in text:
              raise SystemExit('Expected readHistory syntax anchor missing')
          ui.write_text(text.replace(old, new, 1))

          sidecar = Path('ops/hetzner/db-lab-api/server.mjs')
          text = sidecar.read_text()
          old = '''function readLike(kind) {
  return ["SELECT", "SHOW", "DESCRIBE", "DESC", "EXPLAIN"].includes(kind);
}

'''
          if old not in text:
              raise SystemExit('Expected unused readLike helper missing')
          sidecar.write_text(text.replace(old, '', 1))
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "gimmejob-agent"
          git config user.email "77669556+sergiiiavt@users.noreply.github.com"
          git add app/playgrounds/databases/database-playground.tsx ops/hetzner/db-lab-api/server.mjs
          git commit -m "Fix database playground syntax"
          git push origin HEAD:agent/database-playground
