name: Apply personal stars prevalence audit

on:
  push:
    branches:
      - agent/personal-stars-prevalence-audit
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/personal-stars-prevalence-audit
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply scoped source changes
        run: |
          node scripts/_agent-fix-personal-stars-migration.mjs
          node scripts/_agent-apply-personal-stars-prevalence.mjs
          node scripts/generate-interview-expansion.mjs
      - name: Install dependencies
        run: npm ci
      - name: Verify like CI
        run: npm run verify
      - name: Commit verified changes and remove temporary automation
        run: |
          rm scripts/_agent-fix-personal-stars-migration.mjs
          rm scripts/_agent-apply-personal-stars-prevalence.mjs
          rm .github/workflows/_agent-apply-personal-stars-prevalence.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Separate personal stars from prevalence"
          git push origin HEAD:agent/personal-stars-prevalence-audit
