name: Diagnose database runtime

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/db-runtime-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_HOST: n8n.gimme-job.com
      DEPLOY_USER: root
      HETZNER_DEPLOY_SSH_KEY: ${{ secrets.HETZNER_DEPLOY_SSH_KEY }}

    steps:
      - name: Validate deployment SSH key
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HETZNER_DEPLOY_SSH_KEY" ]]; then
            echo "HETZNER_DEPLOY_SSH_KEY is missing." >&2
            exit 1
          fi

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$HETZNER_DEPLOY_SSH_KEY" >"$HOME/.ssh/gimmejob-deploy"
          chmod 600 "$HOME/.ssh/gimmejob-deploy"
          ssh-keyscan -T 10 -H "$DEPLOY_HOST" >"$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Inspect database runtime
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gimmejob-deploy" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" <<'REMOTE'
          set -u
          echo '--- bootstrap service ---'
          systemctl show gimmejob-bootstrap.service -p ActiveState -p SubState -p Result -p ExecMainStatus || true
          echo '--- bootstrap log tail ---'
          tail -n 220 /var/log/gimmejob-bootstrap.log 2>/dev/null \
            | sed -E 's/(POSTGRES_PASSWORD|N8N_ENCRYPTION_KEY|MYSQL_LAB_ROOT_PASSWORD|POSTGRES_LAB_ADMIN_PASSWORD)=.*/\1=[REDACTED]/g' || true
          echo '--- compose services ---'
          cd /opt/gimmejob-n8n || exit 0
          docker compose --profile ai ps || true
          echo '--- db-lab-api logs ---'
          docker compose --profile ai logs --tail=120 db-lab-api 2>&1 || true
          echo '--- MySQL base fixture counts ---'
          docker compose exec -T mysql-lab sh -lc \
            'mysql --protocol=TCP -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --batch --skip-column-names -e "SELECT CONCAT_WS(CHAR(58),(SELECT COUNT(*) FROM gimmejob_lab.users),(SELECT COUNT(*) FROM gimmejob_lab.products),(SELECT COUNT(*) FROM gimmejob_lab.orders));"' 2>&1 || true
          echo '--- MySQL databases ---'
          docker compose exec -T mysql-lab sh -lc \
            'mysql --protocol=TCP -h127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" --batch --skip-column-names -e "SHOW DATABASES LIKE '\''gimmejob%''';"' 2>&1 || true
          REMOTE
