name: Temporary interview prevalence export

on:
  push:
    branches:
      - agent/personal-stars-prevalence-audit
    paths:
      - .github/workflows/tmp-interview-prevalence-export.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/personal-stars-prevalence-audit
          fetch-depth: 0

      - name: Export all interview questions
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const dir = 'content/interview';
          const files = [
            'common-qa.json',
            'canonical-baseline.json',
            'database-sql-bi-qa.json',
            'observability-production-qa.json',
            'restored-coverage-qa.json',
            'testing-foundations-qa.json',
            'embedded-qa.json',
            'modern-sdet-qa.json',
            'core-foundations-qa.json',
            'expanded-qa.json',
          ];
          const rows = ['id\tcategory\tlevel\tkind\tprevalence\tsources\tquestion'];
          for (const file of files) {
            const payload = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
            for (const q of payload.questions ?? []) {
              rows.push([
                q.id,
                q.category ?? '',
                q.level ?? '',
                q.kind ?? '',
                q.prevalence ?? '',
                (q.sourceIds ?? []).join(','),
                String(q.question ?? '').replaceAll('\t', ' ').replaceAll('\n', ' '),
              ].join('\t'));
            }
          }
          fs.mkdirSync('.tmp-audit', { recursive: true });
          fs.writeFileSync('.tmp-audit/interview-prevalence.tsv', rows.join('\n') + '\n');
          console.log(`Exported ${rows.length - 1} questions.`);
          NODE

      - name: Commit audit table
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp-audit/interview-prevalence.tsv
          git commit -m "Temporary interview prevalence audit export"
          git push origin HEAD:agent/personal-stars-prevalence-audit
