name: Agent Sonar duplication fix

on:
  push:
    branches:
      - agent/navigation-followup-a

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22.22
          cache: npm
      - name: Break structural duplication in newly simplified section items
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("app/navigation-config.ts")
          text = p.read_text()
          marker = 'export type NavigationItem = SectionNavigationItem | ExternalNavigationItem;\n'
          helper = '''\nfunction sectionItem(id: SiteSection, label: string): SectionNavigationItem {\n  return { id, label };\n}\n'''
          if helper.strip() not in text:
              if marker not in text:
                  raise SystemExit("NavigationItem marker not found")
              text = text.replace(marker, marker + helper, 1)
          replacements = {
              '{ id: "programming", label: "Programming" },': 'sectionItem("programming", "Programming"),',
              '{ id: "automation", label: "Test automation" },': 'sectionItem("automation", "Test automation"),',
              '{ id: "devops", label: "Cloud & DevOps" },': 'sectionItem("devops", "Cloud & DevOps"),',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"Expected section item not found: {old}")
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - run: npm ci
      - name: Verify fix
        run: |
          npm run verify:fast
          node --test tests/navigation-config.test.ts tests/navigation-paths.test.ts
          npm run verify
          git diff --check
      - name: Commit verified fix
        run: |
          git rm .github/workflows/agent-sonar-duplication-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/navigation-config.ts
          git commit -m "Reduce navigation config duplication"
          git push origin HEAD:agent/navigation-followup-a
