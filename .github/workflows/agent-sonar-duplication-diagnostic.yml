name: Agent Sonar duplication diagnostic

on:
  push:
    branches:
      - agent/navigation-followup-a

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Query Sonar duplication metrics
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          base = "https://sonarcloud.io/api"
          project = "sergiiiavt_gimme-job"
          pr = "458"
          auth = base64.b64encode(f"{os.environ['SONAR_TOKEN']}:".encode()).decode()

          def get(path, params):
              url = f"{base}/{path}?{urllib.parse.urlencode(params)}"
              request = urllib.request.Request(url, headers={"Authorization": f"Basic {auth}"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          metrics = "new_duplicated_lines_density,new_duplicated_lines,new_duplicated_blocks,new_lines,duplicated_lines_density,duplicated_lines,duplicated_blocks,lines,ncloc"

          print("--- project measures ---")
          print(json.dumps(get("measures/component", {
              "component": project,
              "pullRequest": pr,
              "metricKeys": metrics,
          }), sort_keys=True))

          for path in ["app/navigation-config.ts", "app/site-navigation.tsx"]:
              key = f"{project}:{path}"
              print(f"--- measures: {path} ---")
              try:
                  print(json.dumps(get("measures/component", {
                      "component": key,
                      "pullRequest": pr,
                      "metricKeys": metrics,
                  }), sort_keys=True))
              except Exception as exc:
                  print(f"measure error: {exc}")
              print(f"--- duplications: {path} ---")
              try:
                  print(json.dumps(get("duplications/show", {"key": key, "pullRequest": pr}), sort_keys=True))
              except Exception as exc:
                  print(f"duplication error: {exc}")

          print("--- raw changed-file tree sample ---")
          tree = get("measures/component_tree", {
              "component": project,
              "pullRequest": pr,
              "metricKeys": metrics,
              "qualifiers": "FIL",
              "ps": 500,
          })
          for component in tree.get("components", []):
              if component.get("path") in {"app/navigation-config.ts", "app/site-navigation.tsx"}:
                  print(json.dumps(component, sort_keys=True))
          PY
