version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /ops/hetzner/mongo-lab-api
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /ai-service
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories:
      - /ai-service
      - /ops/hetzner/db-lab-api
      - /ops/hetzner/mongo-lab-api
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
