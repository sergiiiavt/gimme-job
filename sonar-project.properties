# Browser/Vinext presentation shells and build/deployment validators are exercised by build,
# rendered-HTML, source-contract, artifact-integrity, or dedicated browser/visual gates. The Node
# LCOV pipeline cannot reliably attribute those executions back to source files, so they remain in
# static analysis but outside the source-level coverage denominator. API & integration follows the
# same policy as the other learning-document shells; Networking, Embedded & IoT, and Performance
# Testing follow that policy as well. Their content contracts are regression-tested.
