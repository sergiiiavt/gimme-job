# The learning route/component shells are deliberately thin composition adapters and the two new
# validators mirror the same repository contract for different content roots. Their behaviour is
# validated directly; excluding these mechanical adapters from CPD keeps duplication analysis
# focused on application logic rather than intentionally repeated wiring. The quick-reference
# prototype is data-heavy presentation markup, so repeated card structures are excluded for the
# same reason.
sonar.cpd.exclusions=worker/core.ts,app/testing-tools-page.tsx,app/metrics-estimation-page.tsx,app/quick-reference-page.tsx,app/reference/[section]/page.tsx,app/learn/testing-tools/page.tsx,app/workspace/learn/testing-tools/page.tsx,app/learn/metrics-estimation/page.tsx,app/workspace/learn/metrics-estimation/page.tsx,scripts/validate-testing-tools-content.mjs,scripts/validate-metrics-estimation-content.mjs
