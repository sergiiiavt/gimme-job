sonar.javascript.lcov.reportPaths=coverage/lcov.info
# These Vinext UI shells are exercised through compiled dist/server/ssr bundles by the current
# Node test suite. The generated LCOV therefore contains dist paths that Sonar intentionally
# excludes and cannot attribute back to the original TSX files. Keep the new-code coverage gate
# focused on source files whose coverage can be mapped reliably; build/rendered-HTML tests still
# exercise these presentation shells.
# Learning paths share one document-page controller. QA Fundamentals, Cloud & DevOps, Testing &
# Diagnostic Tools, and QA Metrics & Estimation supply raw Markdown chapters; Programming and Test
# automation supply structured lessons. The route shells, document controller and Markdown
# presentation are exercised through the compiled Vinext bundle, while curriculum structure and
# source metadata are gated directly by content validators.
# The executable Python block is another learning presentation shell. Its renderer/worker contract
# has a focused regression test and the production build validates the client integration, while
# Vinext LCOV cannot attribute execution of this TSX shell back to the source file.
# Interview question deep links are another client presentation shell: stable URL construction is
# covered directly in content-deep-links.ts, while the focused TSX view and card-link overlay are
# compiled into Vinext SSR assets and cannot be attributed back to their source files by the current
# LCOV pipeline.
# The quick-reference prototype is another presentation shell: it reuses SiteSidebar and renders
# static reference-card data through the same built UI surface, so it follows the same coverage rule.
# The About enhancement and its tiny link-normalization helper are client presentation shells rendered
# through the built Vinext bundle. Static content/config is checked by the build and repository links
# are validated by validate-about-repo-links.mjs; those source lines cannot be attributed from LCOV.
# The vacancies workspace, its auth-aware view resolver, filter enhancer, private audit portal, and
# the two equivalent route shells follow the same presentation-shell rule. Their production build
# and focused source-contract tests exercise the shared public/personal UI contract, while LCOV
# records execution against compiled ssr/assets/*.js.
# The primary-nav scroll state and the shared To top control are tiny client presentation helpers
# mounted from the root layout. Focused regression tests validate their route/scroll contracts,
# while Vinext records runtime execution against compiled assets rather than these TSX source lines.
# Content validators and generators are repository tooling executed before or outside the node:test
# coverage process. They are still hard CI gates, but their execution cannot be represented in LCOV.
# worker/core.ts is the pre-existing Worker implementation moved without logic changes; its
# integration coverage is exercised through the built artifact and does not map back through
# vinext source maps. worker/index.ts is a three-line composition root. The security-sensitive
# multi-user boundary is measured directly in worker/multi-user-boundary.ts.
# app/api/[...route]/route.ts is the same category of issue: its dispatch logic runs through the
# compiled dist/server bundle in the worker-level auth and rendered-HTML tests, so LCOV cannot map
# execution back to the TypeScript source. The tenant-vs-legacy branching it delegates to is
# covered directly in app/api/_tenant-state.ts and app/api/_jobpilot.ts.
# check-drizzle-generation.mjs is itself executed by the canonical verification command; it is
# build-time repository tooling rather than application code and is excluded from LCOV gating.
# deploy-cloudflare.mjs is also repository tooling. `npm run verify` executes its Wrangler dry-run
# after node:test coverage collection, so that real executable gate cannot be represented in LCOV;
# keep it as a hard Cloudflare validation gate rather than adding artificial unit-test scaffolding.
# validate-about-repo-links.mjs is also executed by check:content before node:test coverage starts;
# it fails CI whenever an About-page GitHub blob/tree target points to a missing repository path.
# smoke-vacancy-sources.ts deliberately performs real third-party network calls and is an on-demand
# operational smoke harness, not deterministic application logic. Its parser/runtime dependencies
# are covered separately by fixture and mocked-adapter tests.
# sync-dou-vacancies.ts is likewise a network orchestration harness executed by GitHub Actions.
# DOU payload validation/import behaviour is measured directly in app/api/_dou-vacancy-import.ts.
sonar.coverage.exclusions=app/public-site.tsx,app/site-navigation.tsx,app/primary-nav-scroll-state.tsx,app/to-top-button.tsx,app/layout.tsx,app/qa-fundamentals-page.tsx,app/qa-markdown.tsx,app/executable-python-block.tsx,app/learning-document-page.tsx,app/learning-document-ui.tsx,app/programming-learning-page.tsx,app/automation-learning-page.tsx,app/cloud-devops-page.tsx,app/testing-tools-page.tsx,app/metrics-estimation-page.tsx,app/quick-reference-page.tsx,app/interview-question-deep-link.tsx,app/interview-question-link-overlay.tsx,app/about-site-content.ts,app/about-site-enhancements.tsx,app/about/about-source-link-fix.tsx,app/vacancies-workspace.tsx,app/vacancy-workspace-route.tsx,app/vacancy-audit-portal.tsx,app/vacancy-filter-enhancer.tsx,app/about/page.tsx,app/vacancies/page.tsx,app/workspace/page.tsx,app/resume/page.tsx,app/interview/page.tsx,app/interview/python/page.tsx,app/trends/page.tsx,app/news/page.tsx,app/fight-ai-slop/page.tsx,app/learn/page.tsx,app/learn/[section]/page.tsx,app/reference/[section]/page.tsx,app/learn/qa-fundamentals/page.tsx,app/workspace/learn/qa-fundamentals/page.tsx,app/learn/programming/page.tsx,app/workspace/learn/programming/page.tsx,app/learn/automation/page.tsx,app/workspace/learn/automation/page.tsx,app/learn/cloud-devops/page.tsx,app/workspace/learn/cloud-devops/page.tsx,app/learn/testing-tools/page.tsx,app/workspace/learn/testing-tools/page.tsx,app/learn/metrics-estimation/page.tsx,app/workspace/learn/metrics-estimation/page.tsx,scripts/validate-interview-content.mjs,scripts/generate-interview-expansion.mjs,scripts/interview-prevalence-policy.mjs,scripts/validate-qa-fundamentals-content.mjs,scripts/validate-cloud-devops-content.mjs,scripts/validate-testing-tools-content.mjs,scripts/validate-metrics-estimation-content.mjs,scripts/validate-automation-curriculum-content.mjs,scripts/validate-about-repo-links.mjs,scripts/check-drizzle-generation.mjs,scripts/deploy-cloudflare.mjs,scripts/smoke-vacancy-sources.ts,scripts/sync-dou-