sonar.organization=sergiiiavt
sonar.projectKey=sergiiiavt_gimme-job
sonar.projectName=gimme-job
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,node_modules/**,dist/**,.next/**,coverage/**,public/**,assets/**,content/**,data/**,docs/**,examples/**,drizzle/**,agent/src/resume-fonts.ts
sonar.test.inclusions=tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# worker/core.ts is the pre-existing Worker implementation moved without logic changes; its
# integration coverage is exercised through the built artifact and does not map back through
# vinext source maps. worker/index.ts is a three-line composition root. The security-sensitive
# multi-user boundary is measured directly in worker/multi-user-boundary.ts.
sonar.coverage.exclusions=worker/core.ts,worker/index.ts
sonar.cpd.exclusions=worker/core.ts
