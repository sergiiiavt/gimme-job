sonar.organization=sergiiiavt
sonar.projectKey=sergiiiavt_gimme-job
sonar.projectName=gimme-job
sonar.sourceEncoding=UTF-8

sonar.sources=.
sonar.tests=tests
sonar.exclusions=tests/**,node_modules/**,dist/**,.next/**,coverage/**,public/**,assets/**,content/**,data/**,docs/**,examples/**,drizzle/**,agent/src/resume-fonts.ts
sonar.test.inclusions=tests/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# These Vinext UI shells are exercised through compiled dist/server/ssr bundles by the current
# Node test suite. The generated LCOV therefore contains dist paths that Sonar intentionally
# excludes and cannot attribute back to the original TSX files. Keep the new-code coverage gate
# focused on source files whose coverage can be mapped reliably; build/rendered-HTML tests still
# exercise these presentation shells.
# QA Fundamentals follows the same constraint: its route shells, long-form page controller and
# Markdown renderer are exercised through the compiled Vinext bundle, while curriculum structure,
# source metadata and required-concept coverage are gated directly by validate-qa-fundamentals-content.mjs.
# That validator is a standalone CI command executed before the coverage test process, so it does
# not appear in the node:test LCOV file even though failure of the script fails CI.
# worker/core.ts is the pre-existing Worker implementation moved without logic changes; its
# integration coverage is exercised through the built artifact and does not map back through
# vinext source maps. worker/index.ts is a three-line composition root. The security-sensitive
# multi-user boundary is measured directly in worker/multi-user-boundary.ts.
sonar.coverage.exclusions=app/public-site.tsx,app/site-navigation.tsx,app/qa-fundamentals-page.tsx,app/qa-markdown.tsx,app/learn/qa-fundamentals/page.tsx,app/workspace/learn/qa-fundamentals/page.tsx,scripts/validate-qa-fundamentals-content.mjs,worker/core.ts,worker/index.ts
sonar.cpd.exclusions=worker/core.ts
