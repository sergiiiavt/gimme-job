[project]
name = "gimmejob-ai"
version = "0.1.0"
description = "AI assistant service for GimmeJob"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]==0.163.1",
  "langchain==1.5.0",
  "langchain-openai==1.8.0",
  "langfuse==5.2.0",
  "langgraph==1.2.22",
  "pydantic-settings==2.16.3",
  "openai==2.54.0",
]

[project.optional-dependencies]
test = [
  "coverage==7.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gimmejob_ai"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ai-service/src/gimmejob_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "ai-service/coverage.xml"
