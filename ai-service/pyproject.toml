[project]
name = "gimmejob-ai"
version = "0.1.0"
description = "AI assistant service for GimmeJob"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi[standard]==0.140.8",
  "langchain==1.3.14",
  "langchain-openai==1.4.1",
  "langfuse==4.14.2",
  "pydantic-settings==2.14.2",
]

[project.optional-dependencies]
test = [
  "coverage==7.15.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gimmejob_ai"]

[tool.coverage.run]
branch = true
relative_files = true
source = ["ai-service/src/gimmejob_ai"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.xml]
output = "ai-service/coverage.xml"
