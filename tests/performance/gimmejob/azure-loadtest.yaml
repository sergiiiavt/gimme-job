version: v0.1
testId: gimmejob-prod-smoke
displayName: GimmeJob production full read-only baseline
description: 10-user full read-only production baseline across all defined Locust tasks
testPlan: locustfile.py
testType: Locust
engineInstances: 1
env:
  - name: LOCUST_HOST
    value: https://gimme-job.com
  - name: LOCUST_USERS
    value: "10"
  - name: LOCUST_SPAWN_RATE
    value: "1"
  - name: LOCUST_RUN_TIME
    value: "600"
  - name: LOCUST_TAGS
    value: full-readonly
  - name: GIMMEJOB_HOST
    value: https://gimme-job.com
  - name: GIMMEJOB_PRODUCTION_ACK
    value: gimme-job.com
  - name: GIMMEJOB_MAX_USERS
    value: "100"
  - name: GIMMEJOB_MAX_RUN_SECONDS
    value: "600"
  - name: GIMMEJOB_MAX_FAILURE_RATIO
    value: "0.01"
  - name: GIMMEJOB_MAX_P95_MS
    value: "10000"
failureCriteria:
  - percentage(error) > 1
  - p95(response_time_ms) > 10000
